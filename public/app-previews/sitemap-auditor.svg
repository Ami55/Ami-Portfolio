<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Sitemap Coverage Auditor interface preview</title>
<desc id="desc">An illustrated preview of the app's start screen: discover, verify and compare sitemap coverage, with a website and sitemap audit form.</desc>
<defs><linearGradient id="hero" x2="1" y2=".5"><stop stop-color="#0f172a"/><stop offset=".58" stop-color="#1b1945"/><stop offset="1" stop-color="#3d1d70"/></linearGradient></defs>
<rect width="1280" height="720" fill="#f5f6fb"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="48" y="48" fill="#151b2d" font-size="29" font-weight="800">SEO<tspan fill="#5935ff">Girl</tspan></text>
<text x="1232" y="46" text-anchor="end" fill="#657087" font-size="16" font-weight="600">Sitemap Coverage Auditor</text>
<rect x="32" y="84" width="1216" height="604" rx="40" fill="url(#hero)"/>
<rect x="80" y="136" width="505" height="41" rx="21" fill="#ffffff" fill-opacity=".06" stroke="#8f82c1" stroke-opacity=".45"/>
<circle cx="104" cy="157" r="6" fill="#b28aff"/>
<text x="123" y="163" font-size="15" font-weight="700" letter-spacing="1.5" fill="#d8d3f7">TECHNICAL SEO × RELIABLE EVIDENCE</text>
<g font-size="58" font-weight="800" letter-spacing="-2"><text x="80" y="256" fill="white">See what your</text><text x="80" y="322" fill="white">sitemap</text><text x="80" y="388" fill="#ad98ff">is missing.</text></g>
<g fill="#d5d4e6" font-size="19"><text x="80" y="441">Crawl your website, inspect XML sitemaps,</text><text x="80" y="470">and turn coverage gaps into a clear report.</text></g>
<g fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".13"><rect x="80" y="516" width="182" height="127" rx="16"/><rect x="277" y="516" width="182" height="127" rx="16"/><rect x="474" y="516" width="182" height="127" rx="16"/></g>
<g fill="#5a34fa"><circle cx="108" cy="546" r="14"/><circle cx="305" cy="546" r="14"/><circle cx="502" cy="546" r="14"/></g>
<g fill="white" font-size="13" font-weight="700" text-anchor="middle"><text x="108" y="551">1</text><text x="305" y="551">2</text><text x="502" y="551">3</text></g>
<g fill="white" font-size="18" font-weight="700"><text x="96" y="586">Discover</text><text x="293" y="586">Verify</text><text x="490" y="586">Compare</text></g>
<g fill="#c4c2d9" font-size="13"><text x="96" y="611">Links and sitemap files</text><text x="293" y="611">Eligibility signals</text><text x="490" y="611">Coverage gaps</text></g>
<rect x="718" y="124" width="482" height="530" rx="28" fill="white"/>
<text x="748" y="170" fill="#121827" font-size="27" font-weight="800">Create a live audit</text>
<text x="748" y="202" fill="#677084" font-size="16">Enter your site first. Sample results stay separate.</text>
<path d="M718 228H1200" stroke="#e2e5ed"/>
<g fill="#172033" font-size="16" font-weight="700"><text x="748" y="266">Website homepage *</text><text x="748" y="366">Sitemap URL <tspan font-weight="400" fill="#677084">(optional)</tspan></text><text x="748" y="470">URL limit</text><text x="970" y="470">Crawl speed</text></g>
<g fill="white" stroke="#d9dde7"><rect x="748" y="284" width="422" height="52" rx="13"/><rect x="748" y="384" width="422" height="52" rx="13"/><rect x="748" y="488" width="201" height="47" rx="13"/><rect x="969" y="488" width="201" height="47" rx="13"/></g>
<g fill="#8a91a0" font-size="16"><text x="765" y="316">https://example.com</text><text x="765" y="416">https://example.com/sitemap.xml</text></g>
<g fill="#172033" font-size="15"><text x="765" y="517">1,000 · standard</text><text x="986" y="517">Conservative</text></g>
<text x="748" y="565" fill="#4b6670" font-size="14">✓  robots.txt respected by default</text>
<rect x="748" y="586" width="422" height="45" rx="13" fill="#5935f5"/>
<text x="959" y="615" text-anchor="middle" fill="white" font-size="17" font-weight="700">Start live audit →</text>
</g></svg>
